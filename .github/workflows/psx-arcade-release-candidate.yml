name: PodScape PSX arcade release candidate
on:
  push:
    branches:
      - codex/psx-arcade-ui-release-ready-20261112
      - codex/psx-news-first-hierarchy-rules-20261112
      - codex/podscape-refinement-era-20261112
      - codex/podscape-universe-polish-20261112
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: TypeScript
        run: pnpm run typecheck
      - name: Release candidate safety
        run: |
          node scripts/verify-psx-arcade-release.mjs
          pnpm run test:psx-v3
          pnpm run test:pod-exchange
          pnpm run test:exchange-achievements
          node scripts/verify-release-readiness.mjs
          node scripts/verify-manager-workspaces.mjs
          node scripts/verify-collection-ledger-flow.mjs
          node scripts/verify-refinement-era.mjs
          node scripts/verify-universe-polish.mjs
          node scripts/verify-universe-consistency-audit.mjs
          node scripts/verify-universe-interactions.mjs
          node scripts/verify-interface-route-consistency.mjs
          node scripts/verify-visual-refinement.mjs
          node scripts/verify-keeper-bin-labels.mjs
          node scripts/verify-design-system.mjs
          node scripts/verify-theme-system.mjs
          node scripts/verify-info-sheet-theme.mjs
          node scripts/verify-onboarding-personalization.mjs
          node scripts/verify-fun-zone-learning.mjs
          node scripts/verify-fun-zone-completion-flow.mjs
          node scripts/verify-fun-zone-portal.mjs
          node scripts/verify-ui-preferences.mjs
          node scripts/verify-ranking-name-privacy.mjs
      - name: Production Next.js build
        run: pnpm run build
