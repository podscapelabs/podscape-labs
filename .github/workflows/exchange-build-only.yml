name: Pod Exchange build-only verification
on:
  push:
    branches:
      - codex/pod-exchange-playable-beta-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm run typecheck
      - name: Verify Pod Exchange mechanics
        run: pnpm run test:pod-exchange
      - name: Verify Exchange achievements
        run: pnpm run test:exchange-achievements
      - name: Verify Fun Zone portal customization
        run: pnpm run test:fun-zone-portal
      - name: Verify theme system and responsive roles
        run: pnpm run check:theme-system
      - name: Verify PodScape shared design system
        run: node scripts/verify-design-system.mjs
      - name: Verify Arcade and market automatic rankings
        run: |
          node scripts/verify-fun-zone-rankings.mjs
          node scripts/verify-lifetime-exp-rankings.mjs
          node scripts/verify-market-rankings.mjs
          node scripts/verify-ranking-name-privacy.mjs
          node scripts/verify-ranking-modal-refinement.mjs
          node scripts/verify-fun-zone-rankings-spotlight.mjs
      - name: Verify retired currency cannot return to the platform
        run: node scripts/verify-retired-currency.mjs
      - name: Verify safe signups and puzzle progression
        run: |
          node scripts/verify-unique-usernames.mjs
          node scripts/verify-fun-zone-completion-flow.mjs
      - name: Build Next.js without deploying
        run: pnpm run build
