name: PodScape workspace QA
on:
  push:
    branches:
      - codex/unified-home-manager-customization
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck application
        run: pnpm run typecheck
      - name: Build Next.js application
        run: pnpm run build
      - name: Lint updated workspaces
        run: pnpm exec eslint components/PodscapeWorkspaceUI.tsx components/KeeperScanner.tsx components/KeeperBinTools.tsx components/KeeperWorkspace.tsx app/keeper/scan/page.tsx app/keeper/actions.ts 'app/keeper/[id]/page.tsx' 'app/keeper/[id]/details/page.tsx' 'app/keeper/[id]/history/page.tsx' lib/keeper.ts app/shop/page.tsx app/ledger/page.tsx 'app/ledger/[slug]/page.tsx' components/LedgerPageIntro.tsx
