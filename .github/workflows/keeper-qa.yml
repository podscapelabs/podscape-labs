name: PodScape pre-deployment QA
on:
  push:
    branches:
      - codex/unified-home-manager-customization
      - codex/ledger-navigation-optimization
      - codex/podscape-unified-release-20261109
      - codex/podscape-manager-psx-release-20261112
      - codex/podscape-universe-polish-20261112
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: podscape-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Lint, typecheck & production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint entire repository
        run: pnpm run lint
      - name: Typecheck application
        run: pnpm run typecheck
      - name: Leaf Ledger regression checks
        run: node scripts/verify-ledger.mjs
      - name: Fun Zone regression checks
        run: pnpm run test:fun-zone
      - name: Pod Exchange mechanics and long-running market checks
        run: pnpm run test:pod-exchange
      - name: Pod Exchange achievement and atomic-wallet checks
        run: pnpm run test:exchange-achievements
      - name: Fun Zone portal widget and shared editor checks
        run: pnpm run test:fun-zone-portal
      - name: Onboarding and customization achievement checks
        run: node scripts/verify-experience-achievements.mjs
      - name: Cross-device UI preference and RLS regression checks
        run: node scripts/verify-ui-preferences.mjs
      - name: Manager workspace regression checks
        run: node scripts/verify-manager-workspaces.mjs
      - name: PodScape icon and shared-editor design system checks
        run: node scripts/verify-design-system.mjs
      - name: Legacy icon and portal surface regression checks
        run: node scripts/verify-legacy-icon-rollout.mjs
      - name: Mobile, PWA and release readiness checks
        run: node scripts/verify-release-readiness.mjs
      - name: "Unified release: vendor, updates, widgets and splash"
        run: node scripts/verify-unified-release.mjs
      - name: Theme role, contrast and overflow audit
        run: node scripts/verify-theme-system.mjs
      - name: Stabilization security and server-boundary checks
        run: node scripts/verify-stabilization-boundaries.mjs
      - name: Universe-wide Owner Studio and contextual navigation checks
        run: |
          node scripts/verify-universe-polish.mjs
          node scripts/verify-universe-consistency-audit.mjs
          node scripts/verify-universe-interactions.mjs
          node scripts/verify-interface-route-consistency.mjs
          node scripts/verify-visual-refinement.mjs
      - name: Build Next.js application
        run: pnpm run build
